# Loads the extensions of META-INF/services/org.junit.jupiter.api.extension.Extension for every
# test: UncaughtExceptionsExtension fails a test whose background thread died on an uncaught
# throwable (under -Pjml-rac, a contract violation there).
junit.jupiter.extensions.autodetection.enabled=true
