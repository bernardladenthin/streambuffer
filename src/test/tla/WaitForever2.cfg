\* TLC model of StreamBufferWaitForever.tla: two threads calling forever (read(), read(b, 0, 2), waitForAtLeast(2)), 3 bytes, one writer, one closer; every call returns
SPECIFICATION SpecF
CONSTANTS
    Threads = {1, 2}
    None = 0
    NW = 1
    NC = 1
    Bytes = 3
    RecLen = 2
    Calls0 = 1
    CheckedReturn = TRUE
    K <- KMixed
    M <- MTwo
INVARIANT Safety
PROPERTY EveryCallReturns
\* a run in which every thread stopped has no step; the liveness property judges the rest
CHECK_DEADLOCK FALSE
