\* check.sh: the tables of a TraceGraph.tla automaton are evaluated once, not at every step.
\* The constants as graphmin.py writes them.
CONSTANTS
    Readers <- TReaders
    ByteReaders <- TByteReaders
    WaitCallers <- TWaitCallers
    Bytes <- TBytes
    ChunkLen <- TChunkLen
    ReadLen <- TReadLen
    NW = 1
    NC = 1
    WriterName <- TWriterName
    CloserName <- TCloserName
    TraceLog <- TEmpty
    GInit <- TInit
    GEdge <- TEdge
    GOut <- TOut
    K = 6
    Spurious = 3
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INIT GraphInit
NEXT GraphNext
CHECK_DEADLOCK FALSE
