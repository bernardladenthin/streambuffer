\* TLC model: the code since F278, read(), three readers, and up to two spurious wake-ups: no error.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2, r3}
    ByteReaders = {r1, r2, r3}
    WaitCallers = {}
    Bytes = 2
    Spurious = 2
    ChunkLen = 1
    ReadLen = 1
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
