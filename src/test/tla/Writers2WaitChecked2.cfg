\* TLC model: waitForAtLeast(2) next to read(); two writers, one of them writes the 2 bytes, two closers.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, w1}
    ByteReaders = {r1}
    WaitCallers = {w1}
    Bytes = 2
    NW = 2
    NC = 2
    Spurious = 0
    ChunkLen = 2
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
