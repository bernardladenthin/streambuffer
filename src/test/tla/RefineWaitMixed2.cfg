\* TLC refinement check: StreamBuffer.tla in the configuration of Mixed2.cfg refines StreamBufferWait.tla.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {r1}
    WaitCallers = {}
    Bytes = 3
    ChunkLen = 2
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    Refines
