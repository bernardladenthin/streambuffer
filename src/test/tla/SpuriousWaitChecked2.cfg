\* TLC model: the current code, waitForAtLeast(2) and read(), one 2-byte write, up to two spurious wake-ups: no error.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, w1}
    ByteReaders = {r1}
    WaitCallers = {w1}
    Bytes = 2
    Spurious = 2
    ChunkLen = 2
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
