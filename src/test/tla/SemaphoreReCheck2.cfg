\* TLC model: protocol "semaphore" with the re-check under the lock (the second cause of F278 fixed, the first not), readers {r1, r2}, two single-byte writes and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    Bytes = 2
    ReCheck = TRUE
    Protocol = "semaphore"
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    ReaderOrder
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
