\* TLC model of StreamBufferWaitForever.tla: three threads calling forever, 1 byte, one writer, one closer; every call returns
SPECIFICATION SpecF
CONSTANTS
    Threads = {1, 2, 3}
    None = 0
    NW = 1
    NC = 1
    Bytes = 1
    Spurious = 0
    RecLen = 2
    Calls0 = 1
    CheckedReturn = TRUE
    K <- KMixed
    M <- MTwo
INVARIANT Safety
PROPERTY EveryCallReturns
\* a run in which every thread stopped has no step; the liveness property judges the rest
CHECK_DEADLOCK FALSE
