\*
\* check.sh: the trace of TraceStreamBuffer.tla is evaluated once, not at every step.
\* The constants as TraceGenerator writes them, without the invariant (no verdict is wanted).
CONSTANTS
    Readers <- TReaders
    ByteReaders <- TByteReaders
    WaitCallers <- TWaitCallers
    Bytes <- TBytes
    ChunkLen <- TChunkLen
    ReadLen <- TReadLen
    NW = 1
    NC = 1
    WriterName <- TWriterName
    CloserName <- TCloserName
    TraceLog <- TTrace
    K = 6
    Spurious = 3
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INIT TraceInit
NEXT TraceNext
CHECK_DEADLOCK FALSE
