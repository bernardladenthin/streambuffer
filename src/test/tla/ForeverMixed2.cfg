\* TLC model of StreamBufferForever.tla, every thread calls again when done, forever: the code since F279, one read() reader and one read(b, 0, 2) reader; two 2-byte writes (the second cut to 1) and a close.
SPECIFICATION SpecF
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {r1}
    WaitCallers = {}
    Bytes = 3
    Spurious = 0
    ChunkLen = 2
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    EveryCallReturns
