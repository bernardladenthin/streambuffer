\* TLC model: the code since F278, read(), one reader; 2 single-byte writes and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1}
    ByteReaders = {r1}
    WaitCallers = {}
    Bytes = 2
    Spurious = 0
    ChunkLen = 1
    ReadLen = 1
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
