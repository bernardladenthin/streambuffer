\* TLC model: the code since F279, read(b, 0, 2) of two 2-byte records, two readers; 4 single-byte writes and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {}
    WaitCallers = {}
    Bytes = 4
    Spurious = 0
    ChunkLen = 1
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
