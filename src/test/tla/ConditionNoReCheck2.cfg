\* TLC model: protocol "condition" WITHOUT the re-check under the lock (expected to fail), readers {r1, r2}, two single-byte writes and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    Bytes = 2
    ReCheck = FALSE
    Protocol = "condition"
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    ReaderOrder
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
