\* TLC model: the condition without the re-check, two readers (expected to fail); 2 single-byte writes and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {r1, r2}
    WaitCallers = {}
    Bytes = 2
    ChunkLen = 1
    ReadLen = 1
    Protocol = "condition"
    ReCheck = FALSE
    AtomicRead = TRUE
    CountOnce = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
