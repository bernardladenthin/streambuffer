\* TLC model: the code since F279, read(b, 0, 2), two readers; a 3-byte write and a 1-byte write (records span entries), then a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {}
    WaitCallers = {}
    Bytes = 4
    ChunkLen = 3
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
