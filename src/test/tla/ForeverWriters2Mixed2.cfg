\* TLC model of StreamBufferForever.tla: the configuration of Writers2Mixed2.cfg (two writers, two closers), every thread calling again when done, forever.
SPECIFICATION SpecF
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {r1}
    WaitCallers = {}
    Bytes = 3
    NW = 2
    NC = 2
    Spurious = 0
    ChunkLen = 2
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    EveryCallReturns
