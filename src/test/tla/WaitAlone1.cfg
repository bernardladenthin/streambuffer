\* TLC model: the current code, waitForAtLeast(2) alone; one 2-byte write and a close, so every signal wakes it to enough bytes or a closed buffer (the base of the spurious wake-up control of check.sh).
SPECIFICATION Spec
CONSTANTS
    Readers = {w1}
    ByteReaders = {}
    WaitCallers = {w1}
    Bytes = 2
    Spurious = 0
    ChunkLen = 2
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
