\*
\* check.sh: the word is accepted without spurious wake-ups (TraceNotDone violated: every line
\* consumed). The constants as TraceGenerator writes them, but Spurious = 0.
CONSTANTS
    Readers <- TReaders
    ByteReaders <- TByteReaders
    WaitCallers <- TWaitCallers
    Bytes <- TBytes
    ChunkLen <- TChunkLen
    ReadLen <- TReadLen
    NW = 1
    NC = 1
    WriterName <- TWriterName
    CloserName <- TCloserName
    TraceLog <- TTrace
    K = 6
    Spurious = 0
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INIT TraceInit
NEXT TraceNext
INVARIANT TraceNotDone
CHECK_DEADLOCK FALSE
