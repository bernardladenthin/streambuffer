\* TLC model: probe of Writers2Condition2.cfg: two writers signal at once, so they do run concurrently (must be violated).
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {r1, r2}
    WaitCallers = {}
    Bytes = 2
    NW = 2
    NC = 1
    Spurious = 0
    ChunkLen = 1
    ReadLen = 1
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    NoTwoWritersSignalling
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
