\* TLC model of StreamBufferWaitForever.tla: a writer writing forever, no close, two threads, every thread step strongly fair: a reader starves
SPECIFICATION SpecI
CONSTANTS
    Threads = {1, 2}
    None = 0
    NW = 1
    NC = 0
    Bytes = 2
    Spurious = 0
    RecLen = 1
    Calls0 = 1
    CheckedReturn = TRUE
    K <- KOne
    M <- MTwo
INVARIANT Safety
PROPERTY StarvationFree
\* a run in which every thread stopped has no step; the liveness property judges the rest
CHECK_DEADLOCK FALSE
