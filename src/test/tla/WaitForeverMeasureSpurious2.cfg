\* TLC model of StreamBufferWaitForeverLive.tla, the configuration of WaitForever2.cfg: the configuration of WaitForever2.cfg with up to two spurious wake-ups: the steps of the measure (MeasureSteps), and that the fairness per thread implies the fairness by role (FairRole)
SPECIFICATION SpecF
CONSTANTS
    Threads = {1, 2}
    None = 0
    NW = 1
    NC = 1
    Bytes = 3
    Spurious = 2
    RecLen = 2
    Calls0 = 1
    CheckedReturn = TRUE
    K <- KMixed
    M <- MTwo
INVARIANT Safety
PROPERTIES
    MeasureSteps
    FairRole
\* a run in which every thread stopped has no step; the liveness property judges the rest
CHECK_DEADLOCK FALSE
