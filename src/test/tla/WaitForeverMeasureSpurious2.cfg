\* TLC model of StreamBufferWaitForeverLive.tla, the configuration of WaitForever2.cfg with up to two spurious wake-ups: the steps of the measure (MeasureSteps); a spurious wake-up lowers it by its budget. FairRole is checked without them in WaitForeverMeasure2.cfg (a spurious wake-up takes no lock and is no step of a role)
SPECIFICATION SpecF
CONSTANTS
    Threads = {1, 2}
    None = 0
    NW = 1
    NC = 1
    Bytes = 3
    Spurious = 2
    RecLen = 2
    Calls0 = 1
    CheckedReturn = TRUE
    K <- KMixed
    M <- MTwo
INVARIANT Safety
PROPERTIES
    MeasureSteps
\* a run in which every thread stopped has no step; the liveness property judges the rest
CHECK_DEADLOCK FALSE
