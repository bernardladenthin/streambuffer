\*
\* TLC refinement check, a negative control (expected to fail): StreamBuffer.tla with the code before
\* F278 (no re-check under bufferLock, as in ConditionNoReCheck2.cfg) does not refine
\* StreamBufferWait.tla, since its empty take is no step of the abstraction. Only TypeOK as an
\* invariant, so what fails is the refinement, not NoEmptyTake.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {r1, r2}
    WaitCallers = {}
    Bytes = 2
    NW = 1
    NC = 1
    Spurious = 0
    ChunkLen = 1
    ReadLen = 1
    Protocol = "condition"
    ReCheck = FALSE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
PROPERTIES
    Refines
