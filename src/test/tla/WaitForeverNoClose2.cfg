\* TLC model of StreamBufferWaitForever.tla: negative control: no closer; a waiting thread waits forever
SPECIFICATION SpecF
CONSTANTS
    Threads = {1, 2}
    None = 0
    NW = 1
    NC = 0
    Bytes = 3
    Spurious = 0
    RecLen = 2
    Calls0 = 1
    CheckedReturn = TRUE
    K <- KMixed
    M <- MTwo
INVARIANT Safety
PROPERTY EveryCallReturns
\* a run in which every thread stopped has no step; the liveness property judges the rest
CHECK_DEADLOCK FALSE
