\* TLC model: read() next to read(b, 0, 2); two writers sharing writes of 2 and 1 bytes, two closers.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {r1}
    WaitCallers = {}
    Bytes = 3
    NW = 2
    NC = 2
    Spurious = 0
    ChunkLen = 2
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
