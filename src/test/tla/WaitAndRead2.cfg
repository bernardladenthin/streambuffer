\* TLC model: the code since F279, waitForAtLeast(2) next to a read() reader; one 1-byte write and a close (the JPF WaitAndRead harness).
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, w1}
    ByteReaders = {r1}
    WaitCallers = {w1}
    Bytes = 1
    Spurious = 0
    ChunkLen = 1
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
