\* TLC model: WaitAlone1.cfg with up to two spurious wake-ups: only the test of the loop of awaitAtLeast keeps the return from being short (check.sh mutates it).
SPECIFICATION Spec
CONSTANTS
    Readers = {w1}
    ByteReaders = {}
    WaitCallers = {w1}
    Bytes = 2
    Spurious = 2
    ChunkLen = 2
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
