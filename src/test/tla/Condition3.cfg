\* TLC model: protocol "condition", readers {r1, r2, r3}, two single-byte writes and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2, r3}
    Bytes = 2
    ReCheck = TRUE
    Protocol = "condition"
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    ReaderOrder
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
