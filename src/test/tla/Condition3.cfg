\* TLC model: the code since F278, read(), three readers; 2 single-byte writes and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2, r3}
    Bytes = 2
    ReadLen = 1
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
