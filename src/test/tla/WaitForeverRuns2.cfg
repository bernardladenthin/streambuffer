\* TLC model of StreamBufferWaitForever.tla: probe: fair runs in which the threads call forever exist
SPECIFICATION SpecF
CONSTANTS
    Threads = {1, 2}
    None = 0
    NW = 1
    NC = 1
    Bytes = 3
    RecLen = 2
    Calls0 = 1
    CheckedReturn = TRUE
    K <- KMixed
    M <- MTwo
INVARIANT Safety
PROPERTY AllStop
\* a run in which every thread stopped has no step; the liveness property judges the rest
CHECK_DEADLOCK FALSE
