\* TLC model: probe: in SpuriousCondition2, a spurious wake-up happens (NoSpuriousWake must be violated).
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {r1, r2}
    WaitCallers = {}
    Bytes = 2
    Spurious = 2
    ChunkLen = 1
    ReadLen = 1
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    NoSpuriousWake
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
