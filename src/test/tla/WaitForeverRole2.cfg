\* TLC model of StreamBufferWaitForeverLive.tla, the configuration of WaitForever2.cfg with the fairness by role, the assumption of the TLAPS proof: every call returns
SPECIFICATION SpecRole
CONSTANTS
    Threads = {1, 2}
    None = 0
    NW = 1
    NC = 1
    Bytes = 3
    Spurious = 0
    RecLen = 2
    Calls0 = 1
    CheckedReturn = TRUE
    K <- KMixed
    M <- MTwo
INVARIANT Safety
PROPERTY EveryCallReturns
\* a run in which every thread stopped has no step; the liveness property judges the rest
CHECK_DEADLOCK FALSE
