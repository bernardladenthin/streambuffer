\* TLC model: read(b, 0, 2) lowering the count per entry as before F279, two readers (expected to fail); 4 single-byte writes and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, r2}
    ByteReaders = {}
    WaitCallers = {}
    Bytes = 4
    ChunkLen = 1
    ReadLen = 2
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = FALSE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
