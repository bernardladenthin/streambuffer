\* TLC model: the code before F278, waitForAtLeast(2) next to a read() reader; one 1-byte write and a close.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1, w1}
    ByteReaders = {r1}
    WaitCallers = {w1}
    Bytes = 1
    ChunkLen = 1
    ReadLen = 2
    Protocol = "semaphore"
    ReCheck = FALSE
    AtomicRead = FALSE
    CountOnce = FALSE
    CheckedReturn = FALSE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    AllReadersFinish
