\* TLC model of StreamBufferForever.tla, every thread calls again when done, forever: the code since F278, read(), three readers; 2 single-byte writes and a close.
SPECIFICATION SpecF
CONSTANTS
    Readers = {r1, r2, r3}
    ByteReaders = {r1, r2, r3}
    WaitCallers = {}
    Bytes = 2
    Spurious = 0
    ChunkLen = 1
    ReadLen = 1
    Protocol = "condition"
    ReCheck = TRUE
    AtomicRead = TRUE
    CountOnce = TRUE
    CheckedReturn = TRUE
INVARIANTS
    TypeOK
    NoEmptyTake
    Fifo
    AvailLinearizable
    ReaderOrder
    RecordsWhole
    WaitEnoughOrClosed
    NoWriteAfterEof
    EofOnlyWhenClosedAndEmpty
PROPERTIES
    EveryCallReturns
