version = 1
SPDX-PackageName = "streambuffer"
SPDX-PackageSupplier = "Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/bernardladenthin/streambuffer"

[[annotations]]
path = [
    "**.md",
    "CITATION.cff",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014-2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

# The issue/PR templates are kept byte-identical in java-llama.cpp, BitcoinAddressFinder, srcmorph
# and streambuffer (.github/shared-files.sha256) and carry the license of the other shared files.
# Last in this file on purpose: of several matching annotations the last one applies.
[[annotations]]
path = [
    ".github/ISSUE_TEMPLATE/bug_report.md",
    ".github/ISSUE_TEMPLATE/feature_request.md",
    ".github/PULL_REQUEST_TEMPLATE.md",
]
SPDX-FileCopyrightText = "2026 Bernard Ladenthin <bernard.ladenthin@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"
