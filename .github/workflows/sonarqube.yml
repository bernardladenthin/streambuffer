# Template of bernardladenthin/actions (templates/java); the job is its reusable workflow.
# A repository with an analysis of its own (another build, coverage merging) excludes this template.
name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    uses: bernardladenthin/actions/.github/workflows/java-sonarqube.yml@7646ab0603d75ee130463eceaa8988f7352e2d6a # v1.0.0
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
