# Template of bernardladenthin/actions (templates/java); the job is its reusable workflow.
# A repository with an analysis of its own (another build, coverage merging) excludes this template.
name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    uses: bernardladenthin/actions/.github/workflows/java-sonarqube.yml@e7554f8d2e3f2e59dac55c5f6a7cb5be7b6d8606 # v1.2.3
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
