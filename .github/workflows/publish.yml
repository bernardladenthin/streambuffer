name: Publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_central:
        description: "Deploy to Maven Central (snapshot if -SNAPSHOT, release if a vX.Y.Z tag)"
        type: boolean
        default: false

# Supersede an in-flight run when a PR branch is pushed again.
#
# Without this every push starts a full parallel pipeline and the older ones keep
# draining -- four were live at once during one session, which makes "what is CI
# saying right now" genuinely ambiguous and wastes a lot of runner time on results
# nobody will read.
#
# cancel-in-progress is deliberately scoped to pull_request ONLY. A push to main or
# to a v* tag is a release path: cancelling one midway could leave a partially
# published set of artifacts.
#
# cancel-in-progress: false is NOT sufficient on its own to protect a release run.
# GitHub cancels a *pending* run whenever a newer run joins the same group behind an
# in-progress one -- that rule is independent of cancel-in-progress. So with a plain
# `workflow-ref` group, a queued `publish_to_central` dispatch on main could be
# silently dropped by a later push to main, both sharing `Publish-refs/heads/main`.
# Giving every non-PR run its own group (via the unique run_id) means such a run is
# never queued behind a sibling and therefore can never be cancelled, while PR runs
# still share a group per ref and supersede each other as intended.
#
# One-time effect when this expression changes: GitHub reads `concurrency` from the
# workflow file at each run's own ref, so a run started before the change sits in the
# old group and a run started after it sits in the new one. They are different groups,
# so the new push does NOT supersede the in-flight old run -- exactly once, on the
# commit that lands this. It self-heals from the next push on. Expect the same overlap
# when porting this to a sibling repo; it is not a sign the expression is wrong.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Start gate — single cancellable abort window before the pipeline starts.
  # The wait duration lives in the `startgate` GitHub Environment (Settings →
  # Environments → startgate → Wait timer).
  # ---------------------------------------------------------------------------
  startgate:
    name: Start gate (abort window)
    runs-on: ubuntu-latest
    environment: startgate
    steps:
      - run: echo "Start gate elapsed — proceeding with pipeline."

  # ---------------------------------------------------------------------------
  # Files kept byte-identical with the sibling repositories (java-llama.cpp,
  # BitcoinAddressFinder, srcmorph, streambuffer), listed in .github/shared-files.sha256.
  # A copy changed here alone fails; one the siblings list with another hash warns.
  # Also runs the tests of the shared build checks and the release-gate check. This
  # job is itself identical in all four repositories.
  # ---------------------------------------------------------------------------
  shared-files:
    name: Shared files + build checks
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Shared files match .github/shared-files.sha256 (siblings compared, warnings only)
        run: python3 .github/check-shared-files.py
      - name: Build-check tests
        run: python3 -m unittest discover -s .github/buildcheck/tests -t .github
      - name: Release gate (every job gates both publish jobs, or release-gate-exemptions.txt says why)
        run: python3 .github/check-release-gate.py
      - name: Run scripts parse (bash -n over every bash run script of the workflows and actions)
        run: python3 .github/check-run-scripts.py
      - name: Maven versions (warns where a dependency or plugin differs from a sibling repository)
        run: python3 .github/check-versions.py

  # ---------------------------------------------------------------------------
  # GPG signing-key preflight (standalone, no `needs:` — runs in parallel at the
  # very start on every trigger). Reproduces what maven-gpg-plugin does at deploy
  # time so a bad/expired key or wrong passphrase is caught in ~20s instead of
  # failing the publish stage. Declares `environment: maven-central` so it reads
  # the SAME GPG_PRIVATE_KEY / GPG_PASSPHRASE secret the publish jobs use.
  #
  # It is EXPECTED to go RED on refs where the secret is not delivered — fork PRs
  # and other contributors' branches (secrets are withheld there). That red is
  # the intended signal: "this ref cannot sign a release", not a regression.
  #
  # SECURITY: this job NEVER prints secret material. It imports the key into an
  # ephemeral keyring, prints only PUBLIC key metadata (key id, fingerprint,
  # owner UID, algorithm, created/expiry — all of which live on public
  # keyservers), and validates the passphrase by producing + verifying a
  # throwaway signature. The passphrase is passed on fd 3 (never argv, never a
  # log line), `set -x` is deliberately never enabled, and the passphrase is
  # additionally `::add-mask::`ed.
  # ---------------------------------------------------------------------------
  verify-signing-key:
    name: Verify GPG signing key (no secrets printed)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Import key + run sign/verify self-test (prints only PUBLIC metadata)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # Shared, byte-identical in all four repos; the security notes are in the script.
        run: bash .github/verify-signing-key.sh

  # ---------------------------------------------------------------------------
  # GPG signing-key preflight — GRADLE / BouncyCastle path.
  # Companion to the `verify-signing-key` (gpg) job above: that one mirrors
  # maven-gpg-plugin (how the Maven artifacts are signed); this one drives
  # Gradle's `signing` plugin + `useInMemoryPgpKeys` (BouncyCastle) — the path any
  # Gradle-based publish (e.g. an Android AAR) uses to sign. BouncyCastle is a
  # STRICTER parser of the armored key than gpg, so it catches key/format problems
  # gpg tolerates (e.g. the primary-vs-signing-subkey null-PGPPrivateKey issue).
  # It signs a throwaway project (.github/signing-selftest/) — no repo build is
  # involved — so this job is IDENTICAL across the sibling repos and validates the
  # release key via the Gradle path even in repos that do not publish via Gradle
  # yet ("prepared for Gradle"). Standalone (no `needs:`), parallel at pipeline
  # start, `environment: maven-central` so it reads the same secret the publish
  # uses. Red-by-design where the secret is not delivered (see the gpg job's note).
  #
  # SECURITY: prints no secret material. Key/passphrase reach Gradle only via env
  # (read by System.getenv at runtime); `set -x` is never enabled; the passphrase
  # is `::add-mask::`ed; Gradle runs with `--stacktrace` only. Only the produced
  # `.asc` (exit code) is asserted. Uses Gradle 9.6.1.
  # ---------------------------------------------------------------------------
  verify-signing-key-gradle:
    name: Verify GPG signing key — Gradle/BouncyCastle path (no secrets printed)
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: "9.8.2"
      - name: Sign a throwaway artifact via useInMemoryPgpKeys (BouncyCastle)
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail   # NOTE: deliberately NO `set -x` — it would echo the passphrase.

          if [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::MAVEN_GPG_PRIVATE_KEY is empty for this run. The maven-central environment did not deliver the secret to this ref (fork PR / other branch). Nothing to verify."
            exit 1
          fi
          if [ -n "${MAVEN_GPG_PASSPHRASE:-}" ]; then echo "::add-mask::${MAVEN_GPG_PASSPHRASE}"; fi

          PROJ=".github/signing-selftest"
          echo "== Sign a throwaway artifact through Gradle's useInMemoryPgpKeys (BouncyCastle) =="
          gradle --no-daemon -p "$PROJ" signMakeArtifact --stacktrace

          ASC="$PROJ/build/signing-selftest.zip.asc"
          if [ -f "$ASC" ]; then
            echo "  Detached signature produced: $(wc -c < "$ASC") armored bytes"
            echo "RESULT: OK — Gradle's useInMemoryPgpKeys accepted the armored key + passphrase and produced a signature."
          else
            echo "::error::Gradle signing produced no .asc — useInMemoryPgpKeys could not build a usable signatory from MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE."
            exit 1
          fi

  code-style:
    name: Code style (spotless) + package graph
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
      - name: Spotless check (fail fast on format violations)
        run: mvn -B --no-transfer-progress spotless:check
      - name: SpotBugs check (fail fast on static-analysis findings)
        run: mvn -B --no-transfer-progress -DskipTests -Denforcer.skip=true compile spotbugs:check
      - name: Print internal package dependency graph (jdeps, informational)
        continue-on-error: true
        run: |
          mvn -B --no-transfer-progress -DskipTests -Denforcer.skip=true compile
          echo "=== internal package dependency graph (jdeps, bytecode) ==="
          jdeps -verbose:package target/classes | grep 'net\.ladenthin\.' || true

  build:
    name: Build
    needs: startgate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Build
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: jars, path: target/*.jar }

  # ---------------------------------------------------------------------------
  # Packaged-jar smoke -- the streambuffer member of the cross-repo rule "no release
  # asset is attached that CI has not run" (workspace/policies/fat-jar-release-assets.md).
  #
  # Everything else in this pipeline (tests, jqwik, Lincheck, PIT, SpotBugs, javadoc)
  # runs off target/classes; nothing loads the assembled jar, which is what is attached
  # to the GitHub release and deployed to Central. The sibling repos launch their fat
  # jar with `java -jar`; streambuffer ships none (a library, no Main-Class), so the
  # equivalent real use is a consumer putting the jar on a classpath and calling the
  # API. Same job shape, repo-appropriate assertion. ~10 s, no network.
  # ---------------------------------------------------------------------------
  smoke-jar:
    name: Smoke test packaged jar
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: jars, path: jars/ }
      # Cross-repo shared gate (workspace/crossrepostatus.md checksum table). maven.compiler.release
      # governs only the code we compile; a dependency built for a newer Java lands in the jar
      # untouched and surfaces as UnsupportedClassVersionError on a consumer's JVM. This repo's
      # deliverable is the plain library jar, not a fat jar, so the whole downloaded artifact is
      # scanned rather than one uber jar. module-info.class and META-INF/versions/** are skipped
      # unconditionally because a classpath JVM never loads them. Runs before the smoke test so an
      # unloadable class is reported as such instead of as a mysterious smoke failure.
      - name: Verify Java 8 bytecode (no class newer than major 52)
        run: .github/verify-bytecode-version.sh --max-major 52 jars
      - name: Run packaged-jar smoke test
        run: .github/smoke-jar.sh jars 'streambuffer-*.jar'

  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        shell: bash
        run: bash .github/print-host-info.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Memory before tests
        run: free -h
      - name: Test
        run: mvn -e --batch-mode --no-transfer-progress -P jcstress verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
      - name: Memory after tests
        if: always()
        run: free -h
      # Echo the crash logs into the job log (workspace/policies/ci-test-diagnostics.md 3.1).
      - name: Print crash logs (on failure)
        if: failure()
        shell: bash
        run: bash .github/print-crash-logs.sh .
      - name: Upload crash & surefire dumps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crash-dumps
          path: |
            ${{ github.workspace }}/hs_err_pid*.log
            ${{ github.workspace }}/*.hprof
            ${{ github.workspace }}/target/surefire-reports/*.dump
            ${{ github.workspace }}/target/surefire-reports/*.dumpstream
            ${{ github.workspace }}/target/surefire-reports/*.txt
            ${{ github.workspace }}/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore

  vmlens:
    name: Test (vmlens interleavings)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        shell: bash
        run: bash .github/print-host-info.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { java-version-file: .java-version, distribution: temurin, cache: maven }
      - name: Test under vmlens
        run: mvn --batch-mode --no-transfer-progress -Pvmlens test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: vmlens-report
          path: target/vmlens-report/
          if-no-files-found: ignore

  report:
    name: Report
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { java-version-file: .java-version, distribution: temurin, cache: maven }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: jacoco-report, path: target/site/jacoco/ }
        continue-on-error: true
      # The dependency graph is submitted by dependency-submission.yml (on pushes to main, with the
      # JDK of .java-version), not here: this job gates the release path and needs no write access.
      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: target/site/jacoco/jacoco.xml
          format: jacoco
        continue-on-error: true
      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
        continue-on-error: true
      - name: Run PIT mutation tests
        run: mvn --batch-mode --no-transfer-progress test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Extract PIT survivors
        if: always()
        run: |
          echo "=== PIT Survived Mutations ==="
          for html_file in $(find target/pit-reports -name "*.html" -type f | sort); do
            if grep -q "SURVIVED" "$html_file"; then
              echo "Found survivors in $html_file:"
              grep -B 2 -A 3 "SURVIVED" "$html_file"
              echo ""
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with: { name: pit-reports, path: target/pit-reports/ }
      - name: Run JMH benchmarks
        run: >
          mvn --batch-mode --no-transfer-progress exec:java
          -Dexec.mainClass=org.openjdk.jmh.Main
          -Dexec.classpathScope=test
          -Dexec.args="StreamBufferThroughputBenchmark -wi 2 -i 3 -f 0 -rf json -rff target/jmh-results.json"
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with: { name: jmh-results, path: target/jmh-results.json }

  check-snapshot:
    name: "Check: main branch / SNAPSHOT"
    needs: [report]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Every project version ends in -SNAPSHOT before anything is published to the snapshot channel.
      # Only then: a push publishes nothing, and main carries the release version for the commit
      # a release is tagged on.
      - name: Require a SNAPSHOT version
        if: inputs.publish_to_central
        run: python3 .github/publication.py check-ref --channel snapshot

  check-tag:
    name: "Check: v* tag"
    needs: [report]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The tag names exactly the project version (v1.2.3 for 1.2.3), which is no SNAPSHOT.
      - name: Require the release version the tag names
        run: python3 .github/publication.py check-ref --channel release

  publish-snapshot:
    name: Prepare and verify signed snapshot artifacts
    needs:
      - check-snapshot
      - code-style
      - smoke-jar
      - shared-files
      - vmlens
    if: needs.check-snapshot.result == 'success' && inputs.publish_to_central
    runs-on: ubuntu-latest
    environment: maven-central
    outputs:
      assets_complete: ${{ steps.finalize.outputs.complete }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Guard - require a -SNAPSHOT version
        shell: bash
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version | tail -n1)
          echo "Resolved project version: $VERSION"
          case "$VERSION" in
            *-SNAPSHOT) echo "OK: -SNAPSHOT version, continuing local snapshot staging." ;;
            *) echo "::error::Refusing to publish non-SNAPSHOT version '$VERSION' from the snapshot job. Snapshot publishing requires a -SNAPSHOT version; releases go through the v* tag path."; exit 1 ;;
          esac
      - name: Show effective POM (debug)
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true help:effective-pom
      - name: Stage snapshot
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true deploy -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Finalize and secure the signed publication
        id: finalize
        uses: ./.github/actions/finalize-publication
        with:
          channel: snapshot

  github-snapshot:
    name: Update Snapshot Pre-release on GitHub
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-snapshot-assets
          path: publication-package/
          digest-mismatch: error
      - name: Verify transport integrity and export checked GitHub files
        run: python3 .github/publication.py verify publication-package --export-github snapshot-assets
      - name: Update snapshot assets, source tag and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_COMPLETE: ${{ needs.publish-snapshot.outputs.assets_complete }}
        run: python3 .github/update-snapshot.py snapshot-assets

  publish-release:
    name: Prepare and verify signed release artifacts
    needs:
      - check-tag
      - code-style
      - smoke-jar
      - shared-files
      - vmlens
    if: needs.check-tag.result == 'success' && inputs.publish_to_central
    runs-on: ubuntu-latest
    environment: maven-central
    outputs:
      assets_complete: ${{ steps.finalize.outputs.complete }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Show effective POM (debug)
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true help:effective-pom
      - name: Stage release
        run: mvn --batch-mode --no-transfer-progress -P release -DskipUpload=true deploy -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Finalize and secure the signed publication
        id: finalize
        uses: ./.github/actions/finalize-publication
        with:
          channel: release

  github-release:
    name: Attach Binaries to GitHub Release
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release-assets
          path: publication-package/
          digest-mismatch: error
      - name: Verify transport integrity and export checked GitHub files
        run: python3 .github/publication.py verify publication-package --export-github release-assets
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release-assets/*


  central-snapshot:
    name: Upload checked snapshot artifacts to Maven Central
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    environment: maven-central
    # One transfer at a time; an older commit finishing late is skipped (publication.py superseded).
    concurrency:
      group: central-snapshot-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-snapshot-assets
          path: publication-package/
          digest-mismatch: error
      - name: Transfer frozen artifacts (no rebuild, signing or validation polling)
        run: python3 .github/publication.py upload publication-package --skip-superseded
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}

  central-release:
    name: Upload checked release artifacts to Maven Central
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version-file: .java-version
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release-assets
          path: publication-package/
          digest-mismatch: error
      - name: Transfer frozen artifacts (no rebuild, signing or validation polling)
        run: python3 .github/publication.py upload publication-package
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}

  attest-snapshot:
    name: Attest the checked snapshot publication
    needs:
      - publish-snapshot
    if: ${{ !cancelled() && needs.publish-snapshot.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-snapshot-assets
          path: publication-package/
          digest-mismatch: error
      - name: Verify the secured package before attesting
        run: python3 .github/publication.py verify publication-package
      - name: Attest the frozen artifacts and detached signatures
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: publication-package/github/*


  attest-release:
    name: Attest the checked release publication
    needs:
      - publish-release
    if: ${{ !cancelled() && needs.publish-release.outputs.assets_complete == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-release-assets
          path: publication-package/
          digest-mismatch: error
      - name: Verify the secured package before attesting
        run: python3 .github/publication.py verify publication-package
      - name: Attest the frozen artifacts and detached signatures
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: publication-package/github/*
