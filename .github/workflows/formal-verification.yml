# ---------------------------------------------------------------------------------------------
# Formal verification — a SEPARATE pipeline, on purpose.
#
# The synchronous Publish pipeline (publish.yml) stays untouched: these jobs are additional
# evidence, not release gates, and none of them is (or should be made) a required check.
# Failure surfacing is a red check on the PR/commit that does not block a merge.
#
# Three layers (see CLAUDE.md "Formal verification" for the full story and the local recipes;
# the scope rationale with citations lives in the header of
# src/main/jml/net/ladenthin/streambuffer/StreamBuffer.jml):
#
#   openjml-esc   Deductive proof (OpenJML/Z3, extended static checking) of the sequential
#                 static core: both offset/length validators — including the intentional
#                 "(off + len) < 0" int-overflow idiom, proven equivalent to the clean bounds
#                 condition under Java wrap semantics — and the thirteen static trim-decision/
#                 arithmetic/timeout helpers with full functional contracts.
#
#   openjml-rac   Runtime assertion checking: the EXISTING JUnit suite runs against
#                 RAC-instrumented classes, so every JML contract is exercised dynamically
#                 (violations throw instead of the default print-and-continue).
#
#   jpf-interleavings  (scheduled/dispatch only) Java PathFinder EXHAUSTIVELY model-checks the
#                 concurrent read/write/close protocol over all enumerated thread interleavings —
#                 deadlock-freedom + byte fidelity, stronger than the jcstress stress tests.
#                 Heavy (builds jpf-core from source), so it is off the per-PR path.
#
#   virtual-threads-jdk21  (scheduled/dispatch only) StreamBufferVirtualThreadsTest on JDK 21:
#                 reports jdk.VirtualThreadPinned events inside StreamBuffer (a report, not a gate).
#
#   tla-model     (scheduled/dispatch only) TLC model-checks the TLA+ model of the wait/wake-up/
#                 close protocol and the reads (src/test/tla/StreamBuffer.tla): the current code
#                 checks clean, the older code fails with the F278, #212 and F279 counterexamples.
#
#   jcstress-default  (scheduled/dispatch only) jcstress in its default mode on x86; every pull
#                 request runs the quick mode (jcstress.mode in pom.xml) to keep the Test job short.
#
#   arm64-jcstress-benchmark  (dispatch only) jcstress and StreamBufferContendedBenchmark on the
#                 GitHub arm64 runner: ARM's weaker memory model makes jcstress more telling than on
#                 x86; the benchmark is a report (roadmap A7/A8).
#
# What is deliberately NOT here (evaluated 2026-09, see TODO.md "Formal verification"):
# the @GuardedBy("bufferLock") lock discipline is already gated in the DEFAULT pipeline by
# Error Prone's GuardedBy check; the Checker Framework Lock Checker would add soundness but
# cascades into unwinnable receiver-typing on the Closeable/InputStream/OutputStream JDK stubs
# (their stub receivers disagree), so it is deferred. Also not here: KeY (proof maintenance
# dwarfs the gain over OpenJML for this scope), VerCors (would require re-modeling the class in
# a Java subset; no volatile/JMM semantics), JBMC (no ArrayDeque/java.util.concurrent models),
# Infer/RacerD (explicitly does not reason about volatile). Concurrency is additionally covered
# empirically by Lincheck/jcstress/vmlens in the main pipeline.
# ---------------------------------------------------------------------------------------------

name: Formal Verification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly replay on main: catches drift that no PR touches — an OpenJML release pulled from
    # GitHub, a broken download URL, or bit-rot in the pinned tool itself.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Same expression as publish.yml (see the long rationale there): PR runs share a group per ref
# and supersede each other; every non-PR run gets a unique group via run_id so a scheduled or
# dispatched run is never queued behind (and thus never cancelled by) a sibling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  OPENJML_VERSION: "21.0.29"
  # SHA-256 of openjml-ubuntu-24.04-21.0.29.zip, taken from the GitHub release asset digest
  # (https://github.com/OpenJML/OpenJML/releases/tag/21.0.29). ubuntu-latest is ubuntu-24.04,
  # matching the asset. When bumping the version: update both values, re-test the RAC spec
  # fixups in .github/actions/setup-openjml/action.yml, and re-try the class invariants noted
  # in src/main/jml/net/ladenthin/streambuffer/StreamBuffer.jml.
  OPENJML_SHA256: "4fd633e1f555399e47bad8bbbe5ee1f4ae682dab74511ae9e4d7f0a10eeb914b"
  # The ESC scope: the complete static, sequential core of StreamBuffer. Every method listed
  # here MUST prove — and the count guard below additionally fails the job if the number of
  # completed proofs is not exactly ESC_EXPECTED_PROOFS, so a typo here (or a rename in the
  # class) cannot silently shrink the verified scope to zero. Methods NOT listed are covered
  # by RAC + the ordinary test pyramid; the exception-message builder
  # newInvalidOffsetOrLengthToWriteException carries a documented ASSUMED contract (string
  # concatenation is beyond the SMT encoding) and is exercised by RAC and the unit tests.
  ESC_METHODS: "validateOffsetAndLengthToRead;validateOffsetAndLengthToWrite;decideTrimExecution;clampToMaxInt;decrementAvailableBytesBudget;calculateResultingChunks;shouldSkipTrimDueToEdgeCase;shouldSkipTrimDueToInvalidMaxBufferElements;shouldSkipTrimDueToSmallBuffer;shouldSkipTrimDueToSufficientBuffer;isAvailableBytesPositive;isMaxAllocSizeLessThanAvailable;shouldCheckEdgeCase;shouldUpdateMaxObservedBytes;hasTimeLeft;joinsTrimMerge;shouldTrimMergeAll"
  ESC_EXPECTED_PROOFS: "17"
  # The minutes an artifact upload or download may take (see bernardladenthin/actions,
  # common/check-artifact-timeouts): the repository variable, else 20.
  ARTIFACT_TIMEOUT_MINUTES: ${{ vars.ARTIFACT_TIMEOUT_MINUTES || '20' }}

jobs:
  openjml-esc:
    name: OpenJML ESC (deductive proof, static core)
    runs-on: ubuntu-latest
    # ESC can in principle hang on a hard proof obligation (per-attempt --timeout
    # notwithstanding); the job-level timeout is the hard stop.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@379fb9448915b8ce7153f6ec5fa65544205196db # v1.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Set up OpenJML (pinned + checksum-verified)
        uses: ./.github/actions/setup-openjml
        with:
          version: ${{ env.OPENJML_VERSION }}
          sha256: ${{ env.OPENJML_SHA256 }}
      - name: Resolve compile classpath (error_prone_annotations, jspecify, checker-qual)
        run: |
          set -euo pipefail
          mkdir -p target
          mvn -B --no-transfer-progress -q dependency:build-classpath \
            -Dmdep.outputFile=target/compile-classpath.txt -DincludeScope=compile
      - name: ESC — prove the static sequential core
        # Exit codes: 0 = all proved, 6 = verification failure, 1-5 = tool/spec error.
        # No pipes around the openjml call except tee under `set -o pipefail` — a bare
        # `| tee` would swallow the exit code and turn every failure green.
        run: |
          set -euo pipefail
          "$OPENJML_HOME/openjml" --esc --progress \
            --timeout 300 --esc-max-warnings 100 \
            --spec-math=bigint \
            --class-path "$(cat target/compile-classpath.txt)" \
            --specs-path src/main/jml \
            --method "$ESC_METHODS" \
            src/main/java/net/ladenthin/streambuffer/StreamBuffer.java \
            | tee esc-output.log
      - name: Guard — exactly the expected number of proofs completed cleanly
        # `openjml --method <list>` exits 0 even when the list matches NOTHING, so a green
        # ESC step alone does not prove the scope ran. This counts the per-method
        # "Completed proof of ... - no warnings" progress lines.
        run: |
          set -euo pipefail
          completed="$(grep -c '^Completed proof of .* - no warnings' esc-output.log || true)"
          echo "Completed clean proofs: $completed (expected: $ESC_EXPECTED_PROOFS)"
          if [ "$completed" != "$ESC_EXPECTED_PROOFS" ]; then
            echo "::error::ESC proof count mismatch: $completed != $ESC_EXPECTED_PROOFS — the --method selection drifted (rename? typo?) or a proof completed with warnings."
            exit 1
          fi
          {
            echo "### OpenJML ESC"
            echo "$completed/$ESC_EXPECTED_PROOFS methods of the static sequential core proved (OpenJML $OPENJML_VERSION, Z3)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: ESC — the same proofs with a second, independent solver (cvc5)
        # Proof diversity: the same obligations discharged by cvc5 (bundled with OpenJML), so no
        # proof rests on a single solver's correctness. Locally 2026-11-11: 15/15 with cvc5 1.3.2,
        # the ceiling division included; a falsified contract is rejected by both solvers. Yices2,
        # also bundled, fails every obligation with ERROR here and is not used.
        run: |
          set -euo pipefail
          "$OPENJML_HOME/openjml" --esc --progress --prover=cvc5             --timeout 300 --esc-max-warnings 100             --spec-math=bigint             --class-path "$(cat target/compile-classpath.txt)"             --specs-path src/main/jml             --method "$ESC_METHODS"             src/main/java/net/ladenthin/streambuffer/StreamBuffer.java             | tee esc-output-cvc5.log
          completed="$(grep -c '^Completed proof of .* with prover cvc5 - no warnings' esc-output-cvc5.log || true)"
          echo "Completed clean cvc5 proofs: $completed (expected: $ESC_EXPECTED_PROOFS)"
          if [ "$completed" != "$ESC_EXPECTED_PROOFS" ]; then
            echo "::error::cvc5 proof count mismatch: $completed != $ESC_EXPECTED_PROOFS."
            exit 1
          fi
          echo "$completed/$ESC_EXPECTED_PROOFS proved again with cvc5." >> "$GITHUB_STEP_SUMMARY"

  openjml-rac:
    name: OpenJML RAC (contracts under the full test suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@379fb9448915b8ce7153f6ec5fa65544205196db # v1.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Set up OpenJML (pinned + checksum-verified)
        uses: ./.github/actions/setup-openjml
        with:
          version: ${{ env.OPENJML_VERSION }}
          sha256: ${{ env.OPENJML_SHA256 }}
      - name: Resolve compile classpath
        run: |
          set -euo pipefail
          mkdir -p target
          mvn -B --no-transfer-progress -q dependency:build-classpath \
            -Dmdep.outputFile=target/compile-classpath.txt -DincludeScope=compile
      - name: Compile RAC-instrumented classes
        # RAC checks CONTRACTS at runtime; it must not re-derive the overflow-freedom that ESC
        # already proves, so both math modes are set to Java (runtime) semantics:
        #   --code-math=java  — narrowing casts (e.g. the (byte) cast of an int 128..255 in
        #                       write(int)) and any arithmetic wrap match the JVM instead of
        #                       raising a spurious "cast out of range" RAC assertion.
        #   --spec-math=java  — spec expressions evaluate as Java longs. (bigint would need a
        #                       runtime class from OpenJML's patched JDK; the suite forks that
        #                       exact JVM anyway — see the jml-rac profile — but Java math is
        #                       sufficient for every contract here and keeps the bytecode simple.)
        run: |
          set -euo pipefail
          mkdir -p target/rac-classes
          "$OPENJML_HOME/openjml" --rac --rac-show-source=line \
            --code-math=java --spec-math=java \
            --class-path "$(cat target/compile-classpath.txt)" \
            --specs-path src/main/jml \
            -d target/rac-classes \
            src/main/java/net/ladenthin/streambuffer/StreamBuffer.java
      - name: Guard — RAC instrumentation is actually present
        # The whole job is meaningless if the instrumented classes silently contain no JML
        # checks (e.g. specs path drift). RAC-generated code references org.jmlspecs.runtime;
        # a plain javac class file does not.
        run: |
          set -euo pipefail
          if ! grep -q "org/jmlspecs" target/rac-classes/net/ladenthin/streambuffer/StreamBuffer.class; then
            echo "::error::target/rac-classes/.../StreamBuffer.class contains no org.jmlspecs references — RAC instrumentation did not happen."
            exit 1
          fi
      - name: Run the test suite against the RAC classes (violations throw)
        # The jml-rac profile (pom.xml) points surefire's classesDirectory at
        # target/rac-classes, forks OpenJML's own JVM (so the bigint runtime class resolves),
        # puts jmlruntime.jar on the test classpath and sets -Dorg.jmlspecs.openjml.rac=exception
        # so a violated contract fails the suite.
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress -P jml-rac \
            "-Dopenjml.home=$OPENJML_HOME" \
            "-Dopenjml.jdk.java=$OPENJML_HOME/jdk/bin/java" \
            test
          {
            echo "### OpenJML RAC"
            echo "Full JUnit suite passed against RAC-instrumented classes (every JML contract checked at runtime, violations thrown)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # JPF — exhaustive thread-interleaving model check of the concurrent read/write/close protocol.
  # Scheduled/dispatch only (NOT per-PR): building jpf-core from source is minutes-long. This is
  # the erschöpfende counterpart to the jcstress termination tests — see src/test/jpf/README.md.
  # Java PathFinder requires JDK 11 to build and run; the harness is compiled at --release 8 and
  # nothing here reaches the shipped jar. The jpf-core build is cached, keyed on the pinned commit
  # plus the AtomicLong model patch (a completed jpf-core model — see the README).
  # ---------------------------------------------------------------------------------------------
  jpf-interleavings:
    name: JPF exhaustive interleavings (blocking read/write/close)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # TwoReaders.jpf explores about 3.5 million states (18 minutes locally, 2026-11-11),
    # RecordReaders.jpf about 2.4 million (12 minutes), WaitAndRead.jpf about 0.3 million
    # (1.5 minutes), WaitSnapshot.jpf about 0.13 million (30 s), the other three about 2 minutes
    # together.
    timeout-minutes: 90
    env:
      # Pinned jpf-core commit (no upstream releases exist). Bump deliberately; re-validate the
      # AtomicLong model patch on any bump (jpf-core has no release cadence to track).
      JPF_SHA: "e61e396087983cde00b1e4a5f4b3dde39c0f9f7f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@379fb9448915b8ce7153f6ec5fa65544205196db # v1.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          # 25 builds the repo's Java-8 production classes (matching the shipped bytecode);
          # 11 builds and runs jpf-core.
          java-version: |
            11
            25
          distribution: temurin
          cache: maven
      - name: Build Java-8 production classes + collect annotation jars (JDK 25)
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_25_X64"
          mvn -B --no-transfer-progress -DskipTests -Denforcer.skip=true compile
          # Copy the compile-scope dependencies (incl. the optional checker-qual/jspecify/
          # error-prone annotation jars the production bytecode references) into one directory,
          # then stage the three under stable unversioned names for the .jpf classpath. Using
          # copy-dependencies + globs rather than parsing a classpath string keeps this robust
          # across platforms and dependency-version bumps.
          mvn -B --no-transfer-progress dependency:copy-dependencies \
            -DincludeScope=compile -DoutputDirectory=target/anno
          echo "== resolved dependency jars =="; ls -1 target/anno
          mkdir -p src/test/jpf/lib
          cp target/anno/checker-qual-*.jar            src/test/jpf/lib/checker-qual.jar
          cp target/anno/jspecify-*.jar                src/test/jpf/lib/jspecify.jar
          cp target/anno/error_prone_annotations-*.jar src/test/jpf/lib/error-prone-annotations.jar
          echo "== staged annotation jars =="; ls -1 src/test/jpf/lib
      - name: Cache jpf-core build
        id: jpf-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # The whole checkout, not only build/: RunJPF.jar locates jpf-core through the
          # jpf.properties at its root, and on a cache hit the clone below is skipped. With only
          # build/ cached every run after the first failed with "cannot find gov.nasa.jpf.JPF"
          # (weekly runs since 2026-10 at least); the "-dir" in the key retires that cache.
          path: |
            jpf-core
            !jpf-core/.git
          key: jpf-core-dir-${{ env.JPF_SHA }}-atomiclong-${{ hashFiles('src/test/jpf/jpf-model/java/util/concurrent/atomic/AtomicLong.java') }}
      - name: Build jpf-core with the AtomicLong model patch (JDK 11)
        if: steps.jpf-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_11_X64"
          git clone https://github.com/javapathfinder/jpf-core.git jpf-core
          git -C jpf-core checkout "$JPF_SHA"
          # Patch jpf-core's incomplete AtomicLong model (see src/test/jpf/README.md).
          cp src/test/jpf/jpf-model/java/util/concurrent/atomic/AtomicLong.java \
             jpf-core/src/classes/modules/java.base/java/util/concurrent/atomic/AtomicLong.java
          (cd jpf-core && ./gradlew --no-daemon buildJars -x test)
      - name: Model-check the harnesses (JDK 11)
        # RunJPF exits 0 even when it reports "error #N", so the result is gated on the logs below,
        # never on the exit code. Seven harnesses: StreamBuffer.jpf (writer that also closes, reader),
        # WriteClose.jpf (writer, closer and reader in three threads -- the order of write and close,
        # bug hunt F149, which the first one cannot see), TwoReaders.jpf (writer that also closes,
        # two readers on one stream -- bug hunt F278), RecordReaders.jpf (two readers of 2-byte
        # records, written fragmented across the record boundary -- each read takes a whole record),
        # WaitAndRead.jpf (a waitForAtLeast(2) caller next to a reader -- F278),
        # WaitSnapshot.jpf (the same next to a 2-byte write: fewer than 2 only once closed) and
        # TrimReentrancy.jpf (a trim start signal writing from inside the trim, a reader).
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_11_X64"
          cd src/test/jpf
          rm -rf out streambuffer-classes && mkdir -p out streambuffer-classes
          cp -r "$GITHUB_WORKSPACE/target/classes/net" streambuffer-classes/
          "$JAVA_HOME/bin/javac" --release 8 -cp streambuffer-classes -d out \
            net/ladenthin/streambuffer/jpf/JpfStreamBufferHarness.java \
            net/ladenthin/streambuffer/jpf/JpfWriteCloseHarness.java \
            net/ladenthin/streambuffer/jpf/JpfTwoReadersHarness.java \
            net/ladenthin/streambuffer/jpf/JpfRecordReadersHarness.java \
            net/ladenthin/streambuffer/jpf/JpfWaitAndReadHarness.java \
            net/ladenthin/streambuffer/jpf/JpfWaitSnapshotHarness.java \
            net/ladenthin/streambuffer/jpf/JpfTrimReentrancyHarness.java
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/jpf-core/build/RunJPF.jar" StreamBuffer.jpf \
            | tee jpf-output.log
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/jpf-core/build/RunJPF.jar" WriteClose.jpf \
            | tee jpf-output-write-close.log
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/jpf-core/build/RunJPF.jar" TwoReaders.jpf \
            | tee jpf-output-two-readers.log
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/jpf-core/build/RunJPF.jar" RecordReaders.jpf \
            | tee jpf-output-record-readers.log
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/jpf-core/build/RunJPF.jar" WaitAndRead.jpf \
            | tee jpf-output-wait-and-read.log
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/jpf-core/build/RunJPF.jar" WaitSnapshot.jpf \
            | tee jpf-output-wait-snapshot.log
          "$JAVA_HOME/bin/java" -jar "$GITHUB_WORKSPACE/jpf-core/build/RunJPF.jar" TrimReentrancy.jpf \
            | tee jpf-output-trim-reentrancy.log
      - name: Gate on the JPF results
        run: |
          set -euo pipefail
          echo "### JPF exhaustive interleavings" >> "$GITHUB_STEP_SUMMARY"
          for log in src/test/jpf/jpf-output.log src/test/jpf/jpf-output-write-close.log \
                     src/test/jpf/jpf-output-two-readers.log src/test/jpf/jpf-output-record-readers.log \
                     src/test/jpf/jpf-output-wait-and-read.log src/test/jpf/jpf-output-wait-snapshot.log \
                     src/test/jpf/jpf-output-trim-reentrancy.log; do
            if grep -qE '^error #' "$log"; then
              echo "::error::JPF reported an interleaving defect (see $log)."
              exit 1
            fi
            if ! grep -q 'no errors detected' "$log"; then
              echo "::error::JPF did not finish cleanly ('no errors detected' absent in $log) — treat as failure."
              exit 1
            fi
            states="$(grep -oE 'new=[0-9]+' "$log" | head -1 || echo 'new=?')"
            echo "$(basename "$log"): no errors detected over all enumerated schedules ($states states) — no deadlock, no uncaught exception, byte fidelity held." >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: ${{ fromJSON(env.ARTIFACT_TIMEOUT_MINUTES) }}
        if: always()
        with:
          name: jpf-output
          path: src/test/jpf/jpf-output*.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Virtual threads on JDK 21 (TODO roadmap A7) -- scheduled/dispatch only, a REPORT, not a gate.
  # Since JDK 24 (JEP 491) a virtual thread no longer pins its carrier in synchronized, and the
  # default build runs on .java-version (25), where StreamBufferVirtualThreadsTest requires no
  # jdk.VirtualThreadPinned event inside StreamBuffer. On JDK 21 to 23 it only reports them; this
  # job runs the class on JDK 21 (compiled with 25 at testRelease 21, forked into the runner's
  # JDK 21 via surefire's jvm) and writes the report line to the step summary.
  # ---------------------------------------------------------------------------------------------
  virtual-threads-jdk21:
    name: Virtual threads on JDK 21 (pinning report)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@379fb9448915b8ce7153f6ec5fa65544205196db # v1.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Run StreamBufferVirtualThreadsTest on JDK 21 under JFR
        # The recording is started from the command line (streambuffer.test.jvmArgs, a pom property
        # appended to surefire's argLine; -DargLine does not reach the fork because JaCoCo owns that
        # property), so the test itself needs no JFR API and no module flags. The report lists the jdk.VirtualThreadPinned events with a
        # StreamBuffer frame.
        run: |
          set -euo pipefail
          "$JAVA_HOME_21_X64/bin/java" -version
          rec="jdk.VirtualThreadPinned#threshold=0ms,jdk.VirtualThreadPinned#stackTrace=true"
          mvn -B --no-transfer-progress -Djacoco.skip=true -Dtest=StreamBufferVirtualThreadsTest             -Dsurefire.failIfNoSpecifiedTests=false "-Djvm=$JAVA_HOME_21_X64/bin/java"             "-Dstreambuffer.test.jvmArgs=-XX:StartFlightRecording:$rec,dumponexit=true,filename=$PWD/pinning.jfr" test
          "$JAVA_HOME_21_X64/bin/jfr" print --events jdk.VirtualThreadPinned pinning.jfr > pinned.txt
          total="$(grep -c 'jdk.VirtualThreadPinned' pinned.txt || true)"
          ours="$(grep -oE 'net\.ladenthin\.streambuffer\.StreamBuffer\.[A-Za-z$]+\(' pinned.txt | sort | uniq -c || true)"
          {
            echo "### Virtual threads on JDK 21"
            echo "jdk.VirtualThreadPinned events: ${total:-0}. StreamBuffer frames in them (count, method):"
            echo '```'
            echo "${ours:-none}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: ${{ fromJSON(env.ARTIFACT_TIMEOUT_MINUTES) }}
        if: always()
        with:
          name: virtual-threads-jdk21
          path: pinned.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # TLA+ model of the protocol (TODO roadmap A5) -- scheduled/dispatch only, ~90 s of TLC.
  # src/test/tla/check.sh runs every model against its expected outcome: the models of the code
  # since F278 (Protocol "condition" with the re-check) must check clean, safety and liveness; the
  # models of the code before it must fail with exactly the error that shows the defect
  # (NoEmptyTake violated, deadlock after the close). tla2tools.jar is pinned by version and
  # SHA-256 (computed from the release asset, which GitHub lists without a digest for v1.7.4).
  # ---------------------------------------------------------------------------------------------
  tla-model:
    name: TLA+ model of the protocol (TLC)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    env:
      TLA_TOOLS_VERSION: "v1.7.4"
      TLA_TOOLS_SHA256: "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .java-version
          distribution: temurin
      - name: Download tla2tools.jar (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/tla2tools.jar"             "https://github.com/tlaplus/tlaplus/releases/download/$TLA_TOOLS_VERSION/tla2tools.jar"
          echo "$TLA_TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check --strict
      - name: Model-check every model against its expected outcome
        run: |
          set -euo pipefail
          bash src/test/tla/check.sh "$RUNNER_TEMP/tla2tools.jar" | tee tla-check.log
          {
            echo "### TLA+ model (TLC $TLA_TOOLS_VERSION)"
            echo '```'
            cat tla-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # jcstress in its default mode on x86 -- scheduled/dispatch only. Pull requests run the quick
  # mode (jcstress.mode in pom.xml): with the several-reader races the default mode planned 864
  # runs and doubled the Publish pipeline's Test job to 80-90 minutes.
  # ---------------------------------------------------------------------------------------------
  jcstress-default:
    name: jcstress default mode (x86)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@379fb9448915b8ce7153f6ec5fa65544205196db # v1.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: jcstress (default mode)
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress -Djacoco.skip=true -DskipTests test-compile             dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=test-classpath.txt
          cp="$PWD/target/test-classes:$PWD/target/classes:$(cat test-classpath.txt)"
          mkdir -p jcstress-default && cd jcstress-default
          java -cp "$cp" org.openjdk.jcstress.Main -m default | tee ../jcstress-default.log
          result="$(grep -E 'Results: [0-9]+ planned' ../jcstress-default.log | tail -1)"
          echo "### jcstress default mode (x86)" >> "$GITHUB_STEP_SUMMARY"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          case "$result" in
            *", 0 failed, 0 soft errs, 0 hard errs"*) ;;
            *) echo "::error::jcstress default mode: $result"; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------------------------
  # jcstress and the contended benchmark on arm64 (TODO roadmap A7) -- dispatch only. x86 is TSO
  # (stores are not reordered with other stores, loads not with other loads); ARM reorders far more,
  # so a missing happens-before shows up there first. The publish pipeline runs jcstress on x86
  # only (quick mode). Measured once on the GCC Compile Farm (cfarm424, Neoverse-N1, JDK 21, 2026-11-11), see
  # the CHANGELOG; this job repeats it on GitHub's runner on demand.
  # ---------------------------------------------------------------------------------------------
  arm64-jcstress-benchmark:
    name: jcstress + contended benchmark on arm64 (report)
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Display CPU Info
        uses: bernardladenthin/actions/common/print-host-info@379fb9448915b8ce7153f6ec5fa65544205196db # v1.2.2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .java-version
          distribution: temurin
          cache: maven
      - name: Compile the tests and resolve the test classpath
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress -Djacoco.skip=true -DskipTests test-compile             dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=test-classpath.txt
      - name: jcstress (default mode)
        run: |
          set -euo pipefail
          cp="$PWD/target/test-classes:$PWD/target/classes:$(cat test-classpath.txt)"
          mkdir -p jcstress-arm64 && cd jcstress-arm64
          java -cp "$cp" org.openjdk.jcstress.Main -m default | tee ../jcstress-arm64.log
          result="$(grep -E 'Results: [0-9]+ planned' ../jcstress-arm64.log | tail -1)"
          echo "### jcstress on arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          case "$result" in
            *", 0 failed, 0 soft errs, 0 hard errs"*) ;;
            *) echo "::error::jcstress on arm64: $result"; exit 1 ;;
          esac
      - name: StreamBufferContendedBenchmark (report)
        run: |
          set -euo pipefail
          cp="$PWD/target/test-classes:$PWD/target/classes:$(cat test-classpath.txt)"
          java -Duser.language=en -cp "$cp" org.openjdk.jmh.Main StreamBufferContended             -jvmArgsAppend -Duser.language=en -rf csv -rff jmh-arm64.csv
          {
            echo "### StreamBufferContendedBenchmark on arm64 (ms per 11 MiB transfer)"
            echo '```'
            cat jmh-arm64.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: ${{ fromJSON(env.ARTIFACT_TIMEOUT_MINUTES) }}
        if: always()
        with:
          name: arm64-jcstress-benchmark
          path: |
            jcstress-arm64.log
            jmh-arm64.csv
          if-no-files-found: ignore
